name: Sync Krillion scores

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, off the busy :00/:15/:30/:45 marks
  workflow_dispatch:          # lets you hit "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: krillion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull scores from #krillion
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          KRILLION_CHANNEL_ID: C0CD7M5361L
        run: python sync.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "krillion-bot"
          git config user.email "krillion-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update Krillion scores" && git push)
