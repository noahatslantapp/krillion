<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>krillion leaderboard</title>
<meta name="theme-color" content="#050a14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#050a14; --deep:#081426; --surface:#0d1d33; --surface2:#122640;
    --line:rgba(140,200,230,.12); --line2:rgba(140,200,230,.24);
    --ink:#e6f1f5; --muted:#8aa9bd; --faint:#55728a;
    --glow:#5ee6d8; --krill:#ff7a8a; --amber:#ffb547; --gold:#ffe07a;
    --silver:#cfdbe3; --bronze:#d9935f;
    --t-X:#1a2232; --t-B:#1f3d57; --t-F:#1d5f78; --t-S:#5a3f8c; --t-L:#a8621f; --t-T:#c9a227;
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --mono:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--abyss)}
  html,body{overflow-x:clip}
  body{color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;
    background:linear-gradient(180deg,#0e3350 0%,#0a2238 22%,#071629 50%,var(--abyss) 85%) no-repeat;}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px 90px;position:relative;z-index:1}

  /* drifting bubbles */
  .bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bubbles span{position:absolute;bottom:-20px;border-radius:50%;
    border:1px solid rgba(160,230,255,.35);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(160,230,255,.05) 60%);
    animation:rise linear infinite}
  @keyframes rise{to{transform:translate(var(--dx),-110vh);opacity:0}}
  @media (prefers-reduced-motion:reduce){.bubbles{display:none}}

  header{position:relative;padding:54px 0 26px}
  .rays{position:absolute;inset:-60px -40% auto -40%;height:380px;pointer-events:none;opacity:.5;
    background:repeating-conic-gradient(from 180deg at 50% -10%,rgba(150,230,255,.07) 0 4deg,transparent 4deg 13deg);
    mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
  header .inner{position:relative}
  .brand{display:inline-flex;align-items:center;margin-bottom:26px;opacity:.95}
  .brand:hover{opacity:1}
  .slant{height:26px;width:auto;display:block}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--glow);margin-bottom:10px}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(44px,9vw,76px);line-height:.9;letter-spacing:-.02em}
  h1 .ion{color:var(--krill)}
  h1 .shrimp{display:inline-block;font-size:.62em;vertical-align:.18em;margin-left:.12em;animation:bob 4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
  .upd{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:16px}

  .wave{display:block;width:100%;height:22px;margin:6px 0 22px;opacity:.55}

  /* record strip */
  .records{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .rec{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
  .rec .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .rec .v{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.15;margin-top:4px}
  .rec .v small{font-size:14px;color:var(--muted);font-weight:500}
  .rec .w{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .ico{position:absolute;right:10px;top:8px;font-size:26px;opacity:.85}

  /* tabs */
  .tabs{display:flex;gap:6px;background:rgba(5,10,20,.5);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;margin-bottom:18px}
  .tabs button{font:600 13.5px var(--body);color:var(--muted);background:none;border:0;padding:8px 18px;border-radius:999px;cursor:pointer}
  .tabs button.on{background:var(--glow);color:#04212a}
  .panel{display:none}.panel.on{display:block}

  .card{background:rgba(13,29,51,.78);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;overflow:hidden}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;
    padding:14px 12px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap}
  th.l,td.l{text-align:left}
  th:hover{color:var(--ink)}
  th.sorted{color:var(--glow)}
  th.sorted::after{content:" ▾"}
  th.rkh{cursor:default;width:44px;text-align:center}
  td{padding:12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:rgba(94,230,216,.04)}
  .rk{text-align:center;font:700 13px var(--mono);color:var(--faint)}
  .medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#0a0f18;font-size:12.5px}
  .m1{background:var(--gold);box-shadow:0 0 14px rgba(255,224,122,.45)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
  .who{font-weight:600}
  .avgcell{display:flex;align-items:center;justify-content:flex-end;gap:10px}
  .gauge{width:90px;height:6px;border-radius:6px;background:rgba(140,200,230,.12);overflow:hidden}
  .gauge i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--glow),#3a8fd6)}
  .num{font-family:var(--disp);font-weight:700;font-size:16px}
  .unit{color:var(--faint);font-size:11px;margin-left:1px}
  .muted{color:var(--muted)}

  .shallow{padding:14px 16px;border-top:1px dashed var(--line2);font-size:13px;color:var(--muted)}
  .shallow b{color:var(--ink);font-weight:600}

  /* daily */
  .daynav{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line2)}
  .daynav button{background:var(--surface2);border:1px solid var(--line2);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
  .daynav button:disabled{opacity:.3;cursor:default}
  .daytitle{text-align:center}
  .daytitle .n{font-family:var(--disp);font-weight:800;font-size:24px}
  .daytitle .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.08em}
  .row{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.top{background:linear-gradient(90deg,rgba(255,224,122,.08),transparent 70%)}
  .tiles{display:flex;gap:3px}
  .tile{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:13px}
  .tile.X{background:var(--t-X)}.tile.B{background:var(--t-B)}.tile.F{background:var(--t-F)}
  .tile.S{background:var(--t-S)}.tile.L{background:var(--t-L)}.tile.T{background:var(--t-T);box-shadow:0 0 10px rgba(255,224,122,.5)}
  .sc{min-width:64px;text-align:right}

  .legend{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin-top:22px;font-size:12.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend .tile{width:20px;height:20px;font-size:11px}

  .err{padding:30px;text-align:center;color:var(--muted)}

  @media (max-width:640px){
    .records{grid-template-columns:1fr}
    .hide-sm{display:none}
    .gauge{width:44px}
    th,td{padding:11px 8px}
    .row{grid-template-columns:30px 1fr auto;padding:11px 12px}
    .row .tiles{grid-column:2/4;grid-row:2}
    .tile{width:22px;height:22px}
  }
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="wrap">
  <header>
    <div class="rays"></div>
    <div class="inner">
      <a class="brand" href="https://www.slant.app/" target="_blank" rel="noopener"><svg class="slant" role="img" aria-label="Slant" viewBox="0 0 786 200" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M764 200C753.3 200 744.1 196.9 737.7 191.1C731.5 185.9 727.8 178.8 727.8 164.7V70.3H699.3V49.2H727.8V0.1H754.2V49.2H784.9V70.3H754.2V158.6C754.2 168.4 756 171.8 758.8 174.5C761.6 177 765.9 178.8 770.8 178.8C776 178.8 780.9 177.9 785.2 176.4V196.6C778.4 199 771.4 200 764 200Z" fill="white"/><path d="M573.9 196.3V49.2H599V71.9C607.6 55.9 623.6 45.5 643.2 45.5C657.6 45.5 669.8 50.7 678.4 59C686.4 66.9 691.6 78 691.6 97V196.3H665.2V100.7C665.2 86.6 662.5 80.1 657.9 75.5C653.3 70.9 646.5 68.5 638.9 68.5C628.8 68.5 619.6 72.5 613.1 79.5C605.2 88.1 600.3 100.7 600.3 122.4V196.3H573.9Z" fill="white"/><path d="M481.8 200C452.7 200 430.9 181.3 430.9 155.5C430.9 129.5 448.1 116.9 478.1 111.1L502 106.2C518.3 102.8 524.4 98.2 524.4 89C524.4 73.7 511.5 66 494.1 66C474.4 66 460.3 76.4 458.5 97.3L433.7 94.5C434.9 63.6 460 45.5 494.1 45.5C512.4 45.5 527.5 50.7 537.3 60.2C544.9 67.6 549.2 77.7 549.2 94.8V196.3H525V181.9C514.9 193.2 499.6 200 481.8 200ZM487 179.4C497.4 179.4 506.3 176.4 513.1 169.9C519.8 163.5 524.4 154 524.4 139.3V120C520.1 121.8 514.6 123.6 506.3 125.5L483.6 130.1C469.8 133.1 457.3 139.3 457.3 154.6C457.3 169.9 469.8 179.4 487 179.4Z" fill="white"/><path d="M385.6 196.3V0H412V196.3H385.6Z" fill="white"/><path d="M309.1 200C275.1 200 249 178.8 244.1 148.5L269.9 146C272.3 166.9 287.9 180.7 309.1 180.7C328.7 180.7 343.4 170.8 343.4 156.1C343.4 143.6 335.1 137.1 316.1 133.5L294.7 129.2C268.3 124 249 111.1 249 86.6C249 62.3 272.9 45.5 304.8 45.5C336.1 45.5 360 63.6 365.2 88.7L339.4 91.8C337.3 75.5 323.5 64.8 304.8 64.8C287.6 64.8 274.8 73.4 274.8 85.3C274.8 95.8 284.3 101.3 299.9 104.6L322.3 109.2C349.2 115.1 368.8 127 368.8 152.8C368.8 180.7 343.4 200 309.1 200Z" fill="white"/><path d="M198.2 0C199.6 0 200.8 1.2 200.8 2.6L201 80.6C201 89.5 196.3 97.7 188.7 102.3C188.6 102.4 188.5 102.4 188.4 102.5L155.6 117.3C148.3 120.6 143.5 128 143.6 136.1L143.7 185.7C143.7 187.1 142.6 188.3 141.2 188.3L87.5 188.5C86.1 188.5 84.9 187.3 84.9 185.9L84.6 164.2C84.8 151.8 87.3 147.1 94.2 142.9C101.1 138.7 128.1 127.3 128.1 127.3C136.8 123 142.3 114.2 142.3 104.5L142 2.8C142 1.3 143.1 0.2 144.5 0.2L198.2 0L198.2 0V0Z" fill="white"/><path d="M113.6 11.6C115 11.6 116.2 12.7 116.2 14.1L116.3 92.1C116.4 101 111.7 109.3 104.1 113.8C104 113.9 103.9 114 103.7 114L71 128.8C63.7 132.2 58.9 139.5 59 147.6L59.1 197.2C59.1 198.7 58 199.8 56.6 199.8L2.9 200C1.4 200 0.3 198.9 0.3 197.4L0 175.8C0.1 163.3 2.7 158.6 9.6 154.4C16.5 150.2 43.5 138.8 43.5 138.8C52.2 134.6 57.7 125.7 57.6 116L57.4 14.3C57.4 12.9 58.5 11.7 59.9 11.7L113.6 11.5L113.6 11.6V11.6Z" fill="white"/></svg></a>
      <div class="eyebrow">The daily dive · #krillion</div>
      <h1>krill<span class="ion">ion</span><span class="shrimp">🦐</span><br>leaderboard</h1>
      <p id="updated" class="upd"></p>
    </div>
  </header>

  <svg class="wave" viewBox="0 0 880 22" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 11 Q 27.5 0 55 11 T 110 11 T 165 11 T 220 11 T 275 11 T 330 11 T 385 11 T 440 11 T 495 11 T 550 11 T 605 11 T 660 11 T 715 11 T 770 11 T 825 11 T 880 11" fill="none" stroke="#5ee6d8" stroke-width="1.5"/>
  </svg>

  <div class="tabs" role="tablist">
    <button class="on" data-tab="daily">Daily dives</button>
    <button data-tab="all">All-time</button>
  </div>

  <section class="panel" id="p-all">
    <div class="card">
      <table>
        <thead><tr>
          <th class="rkh">#</th>
          <th class="l" data-k="name">Diver</th>
          <th data-k="avg">Avg depth</th>
          <th data-k="best" class="hide-sm">Deepest</th>
          <th data-k="wins">Wins</th>
          <th data-k="dives">Dives</th>
          <th data-k="lanterns" class="hide-sm" title="Midnight-zone answers (85+)">🏮</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="shallow" id="shallow"></div>
    </div>
    <div class="records" id="records"></div>
  </section>

  <section class="panel on" id="p-daily">
    <div class="card">
      <div class="daynav">
        <button id="prev" aria-label="Older dive">‹</button>
        <div class="daytitle"><div class="n" id="dn"></div><div class="d" id="dd"></div></div>
        <button id="next" aria-label="Newer dive">›</button>
      </div>
      <div id="dayrows"></div>
    </div>
  </section>

  <div class="legend" id="legend"></div>
</div>

<script>
const TILE = {X:["⬛","No answer",0],B:["🫧","Surface",10],F:["🐟","Sunlight zone",30],
  S:["🦑","Twilight zone",60],L:["🏮","Midnight zone",85],T:["🌟","One in a krillion",100]};
const MIN_DIVES = 3;
let DATA, sortKey = "avg", dayIdx = 0;

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => new Date(iso + "T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const tiles = t => `<div class="tiles">${[...(t||"")].map(c => TILE[c] ? `<span class="tile ${c}" title="${TILE[c][1]} · ${TILE[c][2]}">${TILE[c][0]}</span>` : "").join("")}</div>`;

function stats(){
  const p = {};
  for (const day of DATA.puzzles){
    const top = Math.max(...day.scores.map(s => s.score));
    for (const s of day.scores){
      const r = p[s.name] ??= {name:s.name,dives:0,total:0,best:0,bestNum:0,wins:0,lanterns:0,stars:0};
      r.dives++; r.total += s.score;
      if (s.score > r.best){ r.best = s.score; r.bestNum = day.num; }
      if (s.score === top && day.scores.length > 1) r.wins++;
      r.lanterns += [...(s.tiles||"")].filter(c => c === "L" || c === "T").length;
      r.stars += [...(s.tiles||"")].filter(c => c === "T").length;
    }
  }
  return Object.values(p).map(r => ({...r, avg: r.total / r.dives}));
}

function renderRecords(all){
  let deep = {score:-1};
  for (const d of DATA.puzzles) for (const s of d.scores) if (s.score > deep.score) deep = {...s, num:d.num};
  const latest = DATA.puzzles[0], champ = latest.scores[0];
  const ties = latest.scores.filter(s => s.score === champ.score).map(s => s.name);
  const mostWins = [...all].sort((a,b) => b.wins - a.wins || b.avg - a.avg)[0];
  document.getElementById("records").innerHTML = `
    <div class="rec"><span class="ico">🌊</span><div class="k">Deepest dive ever</div>
      <div class="v">${deep.score}<small>m</small></div><div class="w">${esc(deep.name)} · #${deep.num}</div></div>
    <div class="rec"><span class="ico">🦐</span><div class="k">Krill of the day · #${latest.num}</div>
      <div class="v">${champ.score}<small>m</small></div><div class="w">${esc(ties.join(" & "))}</div></div>
    <div class="rec"><span class="ico">⚓</span><div class="k">Most daily wins</div>
      <div class="v">${mostWins.wins}<small> wins</small></div><div class="w">${esc(mostWins.name)}</div></div>`;
}

function renderTable(all){
  const q = all.filter(r => r.dives >= MIN_DIVES), sh = all.filter(r => r.dives < MIN_DIVES);
  q.sort((a,b) => sortKey === "name" ? a.name.localeCompare(b.name)
    : (b[sortKey] - a[sortKey]) || (b.avg - a.avg));
  const maxAvg = Math.max(...q.map(r => r.avg), 1);
  document.getElementById("tbody").innerHTML = q.map((r,i) => `
    <tr>
      <td class="rk">${i < 3 && sortKey !== "name" ? `<span class="medal m${i+1}">${i+1}</span>` : i+1}</td>
      <td class="l who">${esc(r.name)}</td>
      <td><div class="avgcell"><span class="gauge"><i style="width:${(r.avg/maxAvg*100).toFixed(1)}%"></i></span>
        <span class="num">${Math.round(r.avg)}<span class="unit">m</span></span></div></td>
      <td class="hide-sm">${r.best}<span class="unit">m</span></td>
      <td>${r.wins}</td>
      <td class="muted">${r.dives}</td>
      <td class="hide-sm muted">${r.lanterns}</td>
    </tr>`).join("");
  document.querySelectorAll("th[data-k]").forEach(th => th.classList.toggle("sorted", th.dataset.k === sortKey));
  document.getElementById("shallow").innerHTML = sh.length
    ? `<b>Still in the shallows</b> (fewer than ${MIN_DIVES} dives): ` + sh.sort((a,b)=>b.avg-a.avg).map(r => `${esc(r.name)} ${Math.round(r.avg)}m`).join(" · ")
    : "";
  document.getElementById("shallow").style.display = sh.length ? "" : "none";
}

function renderDay(){
  const d = DATA.puzzles[dayIdx];
  document.getElementById("dn").textContent = "Krillion #" + d.num;
  document.getElementById("dd").textContent = fmtDate(d.date) + " · " + d.scores.length + " diver" + (d.scores.length === 1 ? "" : "s");
  document.getElementById("prev").disabled = dayIdx >= DATA.puzzles.length - 1;
  document.getElementById("next").disabled = dayIdx <= 0;
  let rank = 0, last = null;
  document.getElementById("dayrows").innerHTML = d.scores.map((s,i) => {
    if (s.score !== last){ rank = i + 1; last = s.score; }
    const medal = rank <= 3 ? `<span class="medal m${rank}">${rank}</span>` : `<span class="rk">${rank}</span>`;
    return `<div class="row ${rank === 1 ? "top" : ""}">
      <div class="rk">${medal}</div><div class="who">${esc(s.name)}</div>${tiles(s.tiles)}
      <div class="sc"><span class="num">${s.score}</span><span class="unit">m</span></div></div>`;
  }).join("");
}

function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " hr ago";
  return new Date(iso).toLocaleString();
}

function boot(data){
  DATA = data;
  if (!DATA.puzzles?.length){ document.getElementById("tbody").innerHTML = `<tr><td colspan="7" class="err">No dives yet.</td></tr>`; return; }
  const all = stats();
  document.getElementById("updated").textContent = "Last new score " + ago(DATA.updated);
  renderRecords(all); renderTable(all); renderDay();
  document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { sortKey = th.dataset.k; renderTable(all); });
  document.getElementById("prev").onclick = () => { dayIdx++; renderDay(); };
  document.getElementById("next").onclick = () => { dayIdx--; renderDay(); };
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.tab));
});

document.getElementById("legend").innerHTML = Object.entries(TILE).reverse()
  .map(([c,[e,n,v]]) => `<span><span class="tile ${c}">${e}</span>${n} · ${v}</span>`).join("");

(() => { const box = document.getElementById("bubbles");
  for (let i = 0; i < 18; i++){ const s = document.createElement("span"), z = 4 + Math.random()*12;
    s.style.cssText = `left:${Math.random()*100}%;width:${z}px;height:${z}px;--dx:${(Math.random()*60-30).toFixed(0)}px;animation-duration:${(12+Math.random()*18).toFixed(1)}s;animation-delay:-${(Math.random()*30).toFixed(1)}s`;
    box.appendChild(s); } })();

/*__INLINE_DATA__*/
if (window.__KRILLION__) boot(window.__KRILLION__);
else fetch("data.json?t=" + Date.now()).then(r => r.json()).then(boot)
